<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>書籍編集</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 200px; }
        button { padding: 8px 15px; margin-right: 10px; cursor: pointer; }

        .update-btn {
            background-color: #28a745;
            color: white;
            border: none;
        }

        .back-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            text-decoration: none;
        }

        .error-message {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h1>書籍編集</h1>

<form th:action="@{/books/edit(id=${bookId})}" th:object="${bookForm}" method="post">

    <div class="form-group">
        <label>タイトル</label>
        <input type="text" th:field="*{title}" />
        <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <div class="form-group">
        <label>著者</label>
        <input type="text" th:field="*{author}" />
        <div class="error-message" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
    </div>

    <div class="form-group">
        <label>ISBN</label>
        <input type="text" th:field="*{isbn}" />
        <div class="error-message" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
    </div>

    <div class="form-group">
        <label>価格</label>
        <input type="number" th:field="*{price}" />
        <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>

    <button type="submit" class="update-btn">更新</button>
    <a th:href="@{/books}" class="back-btn">戻る</a>

</form>

</body>
</html>
